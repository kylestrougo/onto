{% extends "base.html" %}
{% block title %}Create account — Onto{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="brand-big">onto</h1>
  <p class="tagline">Plan your week around what you actually want to do.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.signup') }}">
    <input type="hidden" name="timezone" class="js-timezone" value="">
    <label>Username
      <input name="username" value="{{ username or '' }}" autocomplete="username"
             pattern="[a-zA-Z0-9_.\-]{3,30}" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" minlength="10" required>
      <small>At least 10 characters.</small>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="alt">Already have one? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
