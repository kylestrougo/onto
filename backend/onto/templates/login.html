{% extends "base.html" %}
{% block title %}Sign in — Onto{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="brand-big">onto</h1>
  <p class="tagline">Plan your week around what you actually want to do.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login_post') }}">
    <input type="hidden" name="timezone" class="js-timezone" value="">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
  <p class="alt">New here? <a href="{{ url_for('auth.signup_form') }}">Create an account</a></p>
</div>
{% endblock %}
