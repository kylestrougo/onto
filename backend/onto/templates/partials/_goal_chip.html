{# A library goal in the side panel; the "+ Add" button puts it in the period. #}
<li class="goal-chip" id="goal-chip-{{ goal['id'] }}"
    {% if oob %}hx-swap-oob="beforeend:#library-list"{% endif %}>
  <span class="chip-title">{{ goal['title'] }}</span>
  <span class="chip-meta">
    {{ goal['category_name'] }}{% if goal['recurring'] %} · every week{% endif %}
  </span>
  <button class="btn-mini btn-go chip-add"
          hx-post="{{ url_for('week.add', key=key) if period_kind == 'week' else url_for('month.add', key=key) }}"
          hx-vals='{"goal_id": {{ goal['id'] }}}'
          hx-target="#commit-list" hx-swap="beforeend">+ Add</button>
</li>
